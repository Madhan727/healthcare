{% extends "layout.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-8rem)]">
    <div class="glass-panel p-8 rounded-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6 text-slate-800">Welcome Back</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="mb-4 bg-red-100 border border-red-200 text-red-600 px-4 py-2 rounded text-sm text-center">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email"
                    class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                    required autofocus>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password"
                    class="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                    required>
            </div>

            <div class="flex items-center">
                <input type="checkbox" name="remember"
                    class="rounded text-blue-600 focus:ring-blue-500 border-gray-300">
                <label class="ml-2 block text-sm text-slate-900">Remember me</label>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 shadow-lg">Log
                In</button>
        </form>

        <p class="mt-4 text-center text-sm text-slate-600">
            Don't have an account? <a href="{{ url_for('auth.register') }}"
                class="text-blue-600 hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
