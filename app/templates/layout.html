<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRisk AI - Intelligent Prescription Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen text-slate-800">

    <!-- Navigation -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-white/20 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <a href="{{ url_for('main.index') }}" class="font-bold text-xl tracking-tight text-slate-900">
                        Medi<span class="text-blue-600">Risk</span><span class="text-purple-600">AI</span>
                    </a>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        {% if current_user.is_authenticated %}
                        <a href="{{ url_for('main.dashboard') }}"
                            class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Dashboard</a>
                        <span class="text-slate-400 text-sm">Hello, {{ current_user.name }}</span>
                        <a href="{{ url_for('auth.logout') }}"
                            class="bg-white/50 text-slate-700 hover:bg-white hover:text-red-600 px-4 py-2 rounded-full text-sm font-bold border border-slate-200 transition-all shadow-sm">
                            Logout
                        </a>
                        {% else %}
                        <a href="{{ url_for('auth.login') }}"
                            class="text-slate-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Login</a>
                        <a href="{{ url_for('auth.register') }}"
                            class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-full text-sm font-bold shadow-lg shadow-blue-500/30 transition-all">
                            Get Started
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-8 text-center text-slate-400 text-sm">
        <p>&copy; 2026 MediRisk AI System. All rights reserved.</p>
    </footer>

</body>

</html>
